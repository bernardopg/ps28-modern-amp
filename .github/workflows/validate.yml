name: Repository validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  documentation-and-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
      - name: Validate docs, tasks, skills and infrastructure
        run: make check
      - name: Install simulation engine
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Check LR4, differential LC and bounded analog study (not hardware sign-off)
        run: make simulate
      - name: Fetch audited TI model and check OPA1656 supply-temperature cases (not hardware sign-off)
        run: python3 scripts/simulate_opa1656.py --fetch-model
