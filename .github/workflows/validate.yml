name: Repository validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  documentation-and-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
      - name: Validate docs, tasks, skills and infrastructure
        run: make check
      - name: Install simulation engine
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Check LR4, LC, bounded analog and required unsafe input-order cases (not hardware sign-off)
        run: make simulate
      - name: Preserve passive input-order diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: input-power-order-diagnostics
          path: |
            build/analog/input-power-order/rc-*.log
            build/analog/input-power-order/coupled-*.log
            build/analog/input-power-order/result.json
          if-no-files-found: warn
  official-opamp-model:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - uses: actions/checkout@v4
      - name: Install signed distribution toolchain in ephemeral container (host unchanged)
        run: pacman -Syu --noconfirm python ngspice ca-certificates
      - name: Record ngspice version
        run: ngspice --version
      - name: Fetch audited TI model and check all OPA1656 supply-temperature cases (not hardware sign-off)
        run: python scripts/simulate_opa1656.py --fetch-model
      - name: Verify physical VMID study and required unsafe-power-down counterexamples
        run: python scripts/simulate_vmid.py
      - name: Verify protected analog rail and passive VMID correction under declared envelope
        run: python scripts/simulate_vmid_protection.py
      - name: Preserve official-model diagnostics (never redistribute vendor model)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opa1656-diagnostics
          path: |
            build/analog/opa1656/*.log
            build/analog/opa1656/result.json
            build/analog/vmid/*.log
            build/analog/vmid/result.json
            build/analog/vmid-protection/*.log
            build/analog/vmid-protection/result.json
          if-no-files-found: warn
